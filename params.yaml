# Parámetros del proyecto mibici-demand.
# Las rutas NO van aquí: se calculan en mibici/config.py a partir de PROJ_ROOT.
# Las fechas van entre comillas para que YAML las lea como texto.

datos:
  mes_inicio: "2025-10"
  mes_fin: "2026-09"

# Umbrales actuales de DataCleaner (mibici/cleaning.py)
limpieza:
  duracion_minima_misma_estacion_min: 1  # menos de 1 min en la misma estación: se elimina
  duracion_maxima_min: 1440  # más de 24 h: se elimina
  duracion_atipica_min: 180  # más de 3 h: se marca como atípica
  anio_nacimiento_minimo: 1920

eda:
  top_estaciones: 10
  cuantil_duracion_visible: 0.99

features:
  horizonte_horas: 1  # objetivo: salidas de la estación en la siguiente hora
  rezagos: [1, 24, 168]
  # Solo la usa la normalización de mibici_processed_v2 (features.py).
  # Se retirará con la v3: en el walk-forward el escalado se ajusta dentro de cada ventana.
  fecha_corte: "2026-08-01"
  fin_periodo: "2026-09-30 23:00:00"
  inicio_extension: "2026-09-29 00:00:00"
  dias_festivos:
    - "2025-11-17"
    - "2025-12-25"
    - "2026-01-01"
    - "2026-02-02"
    - "2026-03-16"
    - "2026-05-01"
    - "2026-09-16"

validacion:
  esquema: ventana_creciente
  mes_prueba_inicio: "2026-04"
  mes_prueba_fin: "2026-09"  # 6 ventanas: abril a septiembre de 2026

modelado:
  semilla: 42
  # Particiones del KFold interno del TargetEncoder (codificación de estaciones)
  target_encoder_cv: 5
  # Búsqueda aleatoria para que el ajuste de Gradient Boosting sea viable en una laptop
  busqueda:
    tipo: aleatoria
    n_iter: 8
  # Nombres de los parámetros del estimador, sin el prefijo del Pipeline
  hiperparametros:
    ridge:
      # En la primera corrida se eligió alpha=100 (el máximo) en las 6 ventanas:
      # se amplía hacia valores mayores para no quedar en el borde de la rejilla.
      alpha: [10.0, 100.0, 1000.0, 10000.0]
    hist_gradient_boosting:
      loss: [poisson]
      learning_rate: [0.05, 0.1]
      max_iter: [200, 500]
      # Con max_leaf_nodes=63 y min_samples_leaf=20 el modelo predijo ~15 762 salidas en
      # una hora (junio, RMSE 57): con enlace logarítmico (Poisson), hojas pequeñas dan
      # valores extremos. Se dejan solo hojas grandes y se agrega regularización L2.
      max_leaf_nodes: [15, 31]
      min_samples_leaf: [100, 200]
      l2_regularization: [0.0, 1.0]

# Figuras de diagnóstico de errores (mibici/modeling/error_plots.py)
analisis_errores:
  top_estaciones: 10  # estaciones con mayor error cuadrático en la figura por estación
  n_estaciones_criticas: 4  # estaciones de la hora con mayor RMSE en la figura de extremos

mlflow:
  experimento: mibici-fase2-modelado
  modelo_registrado: mibici-demanda-salidas
